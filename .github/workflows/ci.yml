name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The shared test cases: well-formed JSON, so every gate reads them the same way.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          for f in conformance/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
