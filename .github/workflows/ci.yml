name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The shared test cases: well-formed JSON, so every gate reads them the same way.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every conformance file is strict JSON (no NaN or Infinity, no duplicate keys)
        run: |
          python3 - <<'PY'
          import glob, json, sys

          def no_duplicates(pairs):
              keys = [k for k, _ in pairs]
              duplicate = next((k for k in keys if keys.count(k) > 1), None)
              if duplicate is not None:
                  raise ValueError(f"duplicate key {duplicate!r}")
              return dict(pairs)

          def no_constant(name):
              raise ValueError(f"{name} isn't JSON")

          failed = False
          paths = sorted(p.replace("\\", "/") for p in glob.glob("conformance/*.json"))
          for required in ("conformance/vectors.json", "conformance/gate-config.example.json"):
              if required not in paths:
                  print(f"::error::{required} is missing")
                  failed = True
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as f:
                      json.load(f, object_pairs_hook=no_duplicates, parse_constant=no_constant)
                  print(f"ok {path}")
              except ValueError as error:
                  print(f"::error file={path}::{error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  # @stilebase/sdk: checks, build, and the packed tarball installed as users get it.
  sdk-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
