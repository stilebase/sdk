name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The shared test cases: well-formed JSON, so every gate reads them the same way.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every conformance file is strict JSON (no NaN or Infinity, no duplicate keys)
        run: |
          python3 - <<'PY'
          import glob, json, sys

          def no_duplicates(pairs):
              keys = [k for k, _ in pairs]
              duplicate = next((k for k in keys if keys.count(k) > 1), None)
              if duplicate is not None:
                  raise ValueError(f"duplicate key {duplicate!r}")
              return dict(pairs)

          def no_constant(name):
              raise ValueError(f"{name} isn't JSON")

          failed = False
          paths = sorted(p.replace("\\", "/") for p in glob.glob("conformance/*.json"))
          for required in ("conformance/vectors.json", "conformance/gate-config.example.json"):
              if required not in paths:
                  print(f"::error::{required} is missing")
                  failed = True
          for path in paths:
              try:
                  with open(path, encoding="utf-8") as f:
                      json.load(f, object_pairs_hook=no_duplicates, parse_constant=no_constant)
                  print(f"ok {path}")
              except ValueError as error:
                  print(f"::error file={path}::{error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  # @stilebase/sdk: checks, build, and the packed tarball installed as users get it.
  sdk-js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.18.1", "22.23.4", "24.22.2"] # the oldest supported, and the LTS lines
    defaults:
      run:
        working-directory: sdk-js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  # stilebase-sdk, on every Python it supports: checks, and the built wheel installed as users get it.
  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.10"
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest
      - run: uv build --build-constraints build-constraints.txt --require-hashes # the backend exact and hashed
      - run: bash scripts/smoke.sh ${{ matrix.python }}
